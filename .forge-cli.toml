# forge-cli repository policy; read from the provider base branch.
#
# `supervisors` lists the selectors allowed to take over a review handoff
# whose coordinator has retired (`forge-cli pr review-handoff recover
# --reason coordinator-retired`). The policy is mixed:
#   - `role:steward` authorizes any session launched with an attested steward
#     role (see crates/forge-cli/docs/runbooks/retired-coordinator-recovery.md).
#   - The `sha256:` entry is a temporary per-session bridge for the current
#     steward, which was launched without role attestation.
# Launch stewards with `--role steward --attest-role`, and remove the bridge
# digest once the steward runs attested. See #3853 for the role-based policy.
[review_handoff]
supervisors = ["role:steward", "sha256:41c62d6e75c90f78970202cb1542940e5139689f9c54427eb3293dd37e8c5c59"]
stale_after = "2h"
