[package]
name = "nils-main-agent"
version = "1.29.3"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-main-agent in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_main_agent"
path = "src/lib.rs"

[[bin]]
name = "main-agent"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
jiff = { workspace = true }
libc = "0.2"
nils-agent-session = { version = "1.29.3", path = "../agent-session" }
nils-build-info = { version = "1.29.3", path = "../nils-build-info" }
nils-common = { version = "1.29.3", path = "../nils-common", package = "nils-common" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nils-test-support = { version = "1.29.3", path = "../nils-test-support" }
tempfile = "3"
