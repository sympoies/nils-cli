[package]
name = "nils-speech-test-cli"
version = "1.39.8"
edition.workspace = true
license.workspace = true
description = "CLI crate for nils-speech-test-cli in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[[bin]]
name = "speech-test-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
jiff = { workspace = true }
nils-build-info = { version = "1.39.8", path = "../nils-build-info" }
nils-common = { version = "1.39.8", path = "../nils-common", package = "nils-common" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"

[dev-dependencies]
nils-test-support = { version = "1.39.8", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
