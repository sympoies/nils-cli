[package]
name = "nils-provider-resume"
version = "1.40.0"
edition.workspace = true
license.workspace = true

description = "Shared provider session-resume resolver for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_provider_resume"
path = "src/lib.rs"

[dependencies]
jiff = { workspace = true }
serde_json = { workspace = true }
nils-common = { version = "1.40.0", path = "../nils-common", package = "nils-common" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
