# Nextest configuration.
#
# JUnit report output is written to:
#   target/nextest/<profile>/junit.xml
# So with `--profile ci` this becomes:
#   target/nextest/ci/junit.xml

[profile.ci]
# Retry a test that fails then passes, instead of failing the whole run. The
# workspace has a few tests that are reliable in isolation but flake under
# full-workspace parallelism; without retries a single such flake spuriously
# reds the `test` / `test_macos` gate and blocks merge.
#
# A retried pass is recorded as `<flakyFailure>` in `junit.xml`, printed as
# `FLAKY n/m` in the job log, and listed in the published JUnit check summary,
# which sets `flaky_summary: true`. A masked flake is therefore visible in the
# check people read, not only in the raw log or the uploaded artifact.
#
# One retry, not two. #1524 root-caused and fixed the clusters it inventoried;
# #1667 then measured the retry depth the survivors actually need, over 74 job
# files from two `main` windows. All 29 flaky events passed on the first retry
# and not one reached attempt 2, so the second attempt bought nothing. `0` is
# still not on the table: 7 of 12 runs in the first window carried at least one
# flaky event, so no retries would have turned most `main` pushes red.
#
# Still flaking as of #1667's second window, and worth their own investigation:
# `nils-agent-session` `main_agent_worker_start_distinct_null_id_requests_hold_distinct_authority_fences`,
# `launch_profile_readiness_timeout_kills_its_process_group`,
# `delete_exhausts_bounded_identity_churn_without_losing_current_runtime`,
# and `nils-claude-cli` `spawn_retry_is_bounded_and_limited_to_would_block`.
# Two thirds of those events are macOS. Every cluster investigated so far looked
# like host contention and turned out to be a defect, so find the mechanism
# before reserving threads for any of them.
#
# The paired `metadata::concurrent_distinct_mutations_*` /
# `concurrent_exact_replays_*` were on that list and now have a mechanism:
# #1712. The losing writer failed with `session-record-lock-open-failed` and
# `ENOENT`, which `openat` with `O_CREAT` may not return when the parent exists
# — and the parent is identity-checked immediately before the call. Both lock
# opens now retry that one errno. Treat the cluster as explained but not yet
# confirmed: `retries = 1` means a still-broken macOS lane reports flaky and
# then green rather than red, so the proof is a quiet macOS history, not a
# passing run.
retries = 1

# Every `threads-required = "num-test-threads"` fixture below also carries
# `priority = 100`. nextest starts such a test only once every running test
# has finished, so one queued behind a 74-87 s coordination test left the
# rest of the pool idle for minutes (macOS run 36457009394 sat at ~1 busy
# thread of 3 from 210 s to 390 s). Run first, they start on an idle pool.

# Process-containment fixtures own kernel tracking resources that cannot be
# shared safely across parallel tests. Reserve the full CI thread pool for
# those fixtures so retries do not mask deterministic resource contention.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(/(supervisor|output_cleanup|detached_double_fork|successful_git_output|signal_terminated_target)/)'
threads-required = "num-test-threads"
priority = 100

# This fixture deliberately queues two adoption workers behind one lease lock.
# Keep unrelated suite load from consuming the bounded lock-wait window.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(concurrent_adoption_consumes_a_challenge_exactly_once)'
threads-required = "num-test-threads"
priority = 100

# This fixture verifies two products by invoking same-release descriptor
# producers and runtime handlers. Reserve process capacity so full-workspace
# pressure cannot turn OS child-spawn availability into a semantic failure.
[[profile.ci.overrides]]
filter = 'package(nils-agent-hook) & test(enforce_valid_read_only_bypasses_only_the_declared_fallback_handler)'
threads-required = "num-test-threads"
priority = 100

# This test asserts the wall-clock p95 of 20 `dispatch` process runs per target
# count against 25-100 ms budgets, so CPU taken by other tests counts against
# it. Once priority started it beside the longest agent-session tests, run
# 36474535382 failed both attempts on macOS at 16 targets only (35 and 47 ms)
# while 64 and 256 targets stayed under budget: scheduling noise, not dispatch
# cost; it was on the flaky list above for the same reason.
[[profile.ci.overrides]]
filter = 'package(nils-agent-hook) & test(=codex_apply_patch_target_binding_meets_dispatch_latency_budget)'
threads-required = "num-test-threads"
priority = 100

# These fixtures coordinate same-release subprocesses across bounded barrier
# and transcript-observation windows. Give each the complete CI thread pool so
# unrelated coverage work cannot consume the process admission they validate.
[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(/(main_agent_worker_start_(definitive_recovery_failure_converges_at_(deadline|final_checkpoint|takeover)_boundary|preserves_ambiguous_initial_enter_without_redelivery|timeout_reports_exact_submitted_prompt|waits_for_late_bootstrap_after_recovery_failure))/)'
threads-required = "num-test-threads"
priority = 100

# The longest tests (20-90 s each) start right after the exclusive ones, so
# they overlap with the short tests instead of forming the tail of the run.
[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(/(main_agent_worker_start_finalizer_takeover_resumes_the_same_recovery_attempt|main_agent_submit_recovery_rechecks_authority_inside_the_serialized_send_boundary|main_agent_submit_recovery_fences_concurrent_manager_mutations_until_resolved|two_root_http_federation_acceptance|claimed_runtime_stop_preserves_the_active_claim_for_reconcile_stopped|generated_200_mib_history_converges_through_catalog_refresh_reload_reducer_and_title)/)'
priority = 50

[profile.ci.junit]
path = "junit.xml"
