# Nextest configuration.
#
# Repository gates set store.dir through scripts/ci/gate-reports.py, so JUnit
# output is <owner-report-dir>/nextest/<profile>/junit.xml, outside Cargo caches.
# Raw nextest invocations retain nextest's default store location.

[profile.ci]
# Retry a test that fails then passes, instead of failing the whole run. The
# workspace has a few tests that are reliable in isolation but flake under
# full-workspace parallelism; without retries a single such flake spuriously
# reds the `test` / `test_macos` gate and blocks merge.
#
# A retried pass is recorded as `<flakyFailure>` in `junit.xml`, printed as
# `FLAKY n/m` in the job log, and listed in the published JUnit check summary,
# which sets `flaky_summary: true`. A masked flake is therefore visible in the
# check people read, not only in the raw log or the uploaded artifact.
#
# One retry, not two. #1524 root-caused and fixed the clusters it inventoried;
# #1667 then measured the retry depth the survivors actually need, over 74 job
# files from two `main` windows. All 29 flaky events passed on the first retry
# and not one reached attempt 2, so the second attempt bought nothing. `0` is
# still not on the table: 7 of 12 runs in the first window carried at least one
# flaky event, so no retries would have turned most `main` pushes red.
#
# Still flaking as of #1667's second window, and worth their own investigation:
# `launch_profile_readiness_timeout_kills_its_process_group`,
# `delete_exhausts_bounded_identity_churn_without_losing_current_runtime`,
# and `nils-claude-cli` `spawn_retry_is_bounded_and_limited_to_would_block`.
# Two thirds of those events are macOS. Every cluster investigated so far looked
# like host contention and turned out to be a defect, so find the mechanism
# before reserving threads for any of them.
#
# The paired `metadata::concurrent_distinct_mutations_*` /
# `concurrent_exact_replays_*` were on that list and now have a mechanism:
# #1712. The losing writer failed with `session-record-lock-open-failed` and
# `ENOENT`, which `openat` with `O_CREAT` may not return when the parent exists
# — and the parent is identity-checked immediately before the call. Both lock
# opens now retry that one errno. Treat the cluster as explained but not yet
# confirmed: `retries = 1` means a still-broken macOS lane reports flaky and
# then green rather than red, so the proof is a quiet macOS history, not a
# passing run.
retries = 1

# Terminate a test that is still running after 10 minutes. By default nextest
# only reports such a test as SLOW and waits, so a test that can never return
# holds its job until GitHub's 6 hour limit: two merge-queue runs sat on
# `serve::tests::timed_out_resize_releases_the_shared_lock` that way, run
# 36692666010 for the full 6 hours. A terminated test is reported as TIMEOUT
# and fails like any other, so the job log and the JUnit summary name it.
#
# The bound is measured, not guessed. Over the JUnit reports of 40 successful
# full-lane runs on 2026-09-30, the slowest attempt took 229 s on macOS and
# 132 s on Linux, both
# the former bulk durable-ingest fixture (now seeded as a bounded replay
# regression); every other test finished within 89 s. 600 s is 2.6 times that
# historical slowest. Test-specific bounds belong in overrides below rather
# than a higher bound for every test.
#
# `retries = 1` also retries a terminated test, so one hung test costs up to 20
# minutes. The `timeout-minutes` of the `test` and `test_macos` jobs in
# `.github/workflows/ci.yml` leave room for that on a warm-cache run, so this
# guard reports first; the job limit is the backstop for everything else.
slow-timeout = { period = "60s", terminate-after = 10 }

# Process-containment fixtures own kernel tracking resources that cannot be
# shared safely across parallel tests. Serialize this class while allowing
# unrelated tests to use the rest of the pool.
[test-groups.kernel-tracking]
max-threads = 1

[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(/(supervisor|output_cleanup|detached_double_fork|successful_git_output|signal_terminated_target)/)'
test-group = "kernel-tracking"

# This fixture deliberately queues two adoption workers behind one lease lock.
# Keep other process-capacity fixtures from competing for worker slots.
[test-groups.process-capacity]
max-threads = 1

[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(concurrent_adoption_consumes_a_challenge_exactly_once)'
test-group = "process-capacity"

# This fixture verifies two products by invoking same-release descriptor
# producers and runtime handlers. Avoid concurrent process-capacity fixtures
# while leaving the rest of the suite parallel.
[[profile.ci.overrides]]
filter = 'package(nils-agent-hook) & test(enforce_valid_read_only_bypasses_only_the_declared_fallback_handler)'
test-group = "process-capacity"

# The longest tests (20-90 s each) start right after the exclusive ones, so
# they overlap with the short tests instead of forming the tail of the run.
[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(/(two_root_http_federation_acceptance|generated_200_mib_history_converges_through_catalog_refresh_reload_reducer_and_title)/)'
priority = 50

# This full-window fixture has its own 60 s deadline so timeout failures
# unwind and clean up. Keep a two-minute runner backstop without a retry.
[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(=activity::tests::replay_journal::three_windows_of_exact_events_stay_ingestible_and_recent_replays_deduplicate)'
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

# Tests that require the user systemd manager or cgroup v2 must run serially
# with each other, but do not need to reserve the full test pool.
[test-groups.systemd-cgroup]
max-threads = 1

[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(/(linux_systemd_scope_probe_executes_when_the_user_manager_is_available|linux_systemd_scope_passes_tmux_arguments_through_literally|delete_kills_a_detached_descendant_inside_a_pinned_tmux_control_group)/)'
test-group = "systemd-cgroup"

[[profile.ci.overrides]]
filter = 'package(nils-agent-hook) & test(danger_full_access_preserves_the_host_user_systemd_bus)'
test-group = "systemd-cgroup"

# The idle-waiter test samples the child's CPU ticks against a wall-clock
# window, so it must not run beside another CPU sampler. The test waits for
# the child to go quiet first; the group names the class for later samplers.
[test-groups.cpu-sampling]
max-threads = 1

[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(=mailbox_any_unread::any_unread_wait_idle_cpu_is_bounded)'
test-group = "cpu-sampling"

[profile.ci.junit]
path = "junit.xml"

# The maintainer owns this non-required nightly signal (#1705). The unchanged
# 25-100 ms wall p95 limits include scheduler runqueue waits; reserving the
# Nextest pool cannot reserve the host. Required tests still enforce zero Git
# root-lookup subprocesses. Reconsider required admission only with evidence
# that the execution context controls outside scheduling.
[profile.performance]
default-filter = 'package(nils-agent-hook) & binary(performance_contract) & test(=codex_apply_patch_target_binding_meets_dispatch_latency_budget)'
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.performance.junit]
path = "junit.xml"
