name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # A required merge queue runs every required check on its temporary merge
  # branch before landing the pull request. Linux consumes the combined-tree
  # affected plan; release-only groups also run full Linux/macOS validation.
  merge_group:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# A newer push to a pull request supersedes its older CI run. Merge-group runs
# are never grouped. Main pushes run only the lightweight status lane; scheduled
# and manually dispatched runs exercise the full workflow on main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && 'main-push' || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly-main' || github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: "4"
  DEVLOG_LAYOUT: fragments

jobs:
  changes:
    if: github.event_name != 'push' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    # This bound only stops a hung job: failed or timed-out detection fails the
    # required Linux guard.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      base_sha: ${{ steps.detect.outputs.base_sha }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      release_branch: ${{ steps.detect.outputs.release_branch }}
      release_mode: ${{ steps.detect.outputs.release_mode }}
      release_candidate: ${{ steps.detect.outputs.release_candidate }}
      release_only: ${{ steps.finalize.outputs.release_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change set
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Use the same immutable candidate snapshot as the code planner.
            # Captured event base metadata may lag its actual first parent.
            read -r -a parents <<< "$(git --no-replace-objects show -s --format=%P "${EVENT_SHA}")"
            if [[ ! "${PR_BASE_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || \
               [[ ! "${EVENT_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || \
               [ "${PR_BASE_SHA}" = "${EVENT_SHA}" ] || \
               [ "${#parents[@]}" != "2" ] || [ "${parents[1]:-}" != "${PR_HEAD_SHA}" ] || \
               [ "$(git --no-replace-objects rev-parse HEAD)" != "${EVENT_SHA}" ]; then
              echo 'error: PR candidate snapshot mismatch; validation held' >&2
              exit 1
            fi
            git --no-replace-objects diff --quiet
            git --no-replace-objects diff --cached --quiet
            base="${parents[0]}"
            head="${PR_HEAD_SHA}"
            echo "PR snapshot base=${base} event_base=${PR_BASE_SHA} head=${head} candidate=${EVENT_SHA}"
          elif [ -n "${MERGE_GROUP_BASE_SHA}" ]; then
            base="${MERGE_GROUP_BASE_SHA}"
            head="${MERGE_GROUP_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${EVENT_SHA}"
          fi
          # Any detection error falls back to "false" so the full Rust jobs run
          # rather than leaving the release-gated checks unresolved.
          docs_only="$(bash scripts/ci/detect-docs-only.sh --base "${base}" 2>/dev/null || true)"
          case "${docs_only}" in
            true|false) ;;
            *) docs_only=false ;;
          esac
          release_candidate=false
          release_mode=branch
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            release_mode=merge-group
          fi
          policy_dir="${RUNNER_TEMP}/release-policy"
          mkdir -p "${policy_dir}"
          release_detector="${policy_dir}/detect-release-only.sh"
          policy_available=false
          if git show "${base}:scripts/ci/detect-release-only.sh" >"${release_detector}" 2>/dev/null; then
            policy_available=true
          else
            rm -f "${release_detector}"
          fi
          if { [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "merge_group" ]; } && \
             { [ "${EVENT_NAME}" = "merge_group" ] || [ "${HEAD_REPOSITORY}" = "${REPOSITORY}" ]; } && \
             [ "${policy_available}" = "true" ] && \
             { [ "${EVENT_NAME}" = "merge_group" ] || [ -n "${HEAD_REF}" ]; }; then
            if [ "${EVENT_NAME}" = "merge_group" ]; then
              release_candidate="$(bash "${release_detector}" --base "${base}" --head "${head}" --merge-group 2>/dev/null || true)"
            else
              release_candidate="$(bash "${release_detector}" --base "${base}" --head "${head}" --branch "${HEAD_REF}" 2>/dev/null || true)"
            fi
          fi
          case "${release_candidate}" in
            true|false) ;;
            *) release_candidate=false ;;
          esac
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            docs_only=false
          fi
          {
            echo "base_sha=${base}"
            echo "docs_only=${docs_only}"
            echo "head_sha=${head}"
            echo "release_branch=${HEAD_REF}"
            echo "release_mode=${release_mode}"
            echo "release_candidate=${release_candidate}"
          } >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only} release_candidate=${release_candidate} release_mode=${release_mode} (base=${base}, head=${head})"

      - name: Set up Rust for devlog policy
        uses: dtolnay/rust-toolchain@stable

      - name: Check devlog ownership
        env:
          NILS_CLI_DEVLOG_BASE: ${{ steps.detect.outputs.base_sha }}
        run: |
          cargo build --locked -p nils-devlog
          export PATH="$PWD/target/debug:$PATH"
          python3 scripts/ci/devlog-check.py

      - name: Finalize fail-closed CI lane
        id: finalize
        env:
          RELEASE_CANDIDATE: ${{ steps.detect.outputs.release_candidate }}
        run: |
          # The exact-base detector proves the diff is only the canonical version
          # bump. Release queue entries run the shared full workflow before the
          # required Linux check passes; PRs keep the reduced preparation lane.
          release_only=false
          if [ "${RELEASE_CANDIDATE}" = "true" ]; then
            release_only=true
          fi
          echo "release_only=${release_only}" >> "$GITHUB_OUTPUT"
          echo "release_only=${release_only}"

  cargo_deny:
    if: github.event_name != 'push' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    name: cargo-deny (advisories + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (RUSTSEC advisories + duplicate-version bans)
        run: bash scripts/ci/cargo-deny-audit.sh

  test:
    if: always() && github.event_name != 'push' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, full_validation]
    outputs:
      validation_scope: ${{ steps.validation.outputs.validation_scope }}
    runs-on: ubuntu-24.04
    # Backstop for a hang outside a test, such as a stuck build, install, or
    # audit step. A hung test is ended first by the `ci` nextest profile's
    # `slow-timeout`, which names it. The slowest of 186 successful full-lane
    # runs on 2026-09-28..30 took 21 minutes (19 with a cold cache). Keep the
    # test job limits below the merge queue's 90 minute check timeout and the
    # release PR's 60 minute check wait, so a waiter sees the job fail instead
    # of reaching its own timeout.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: write
    steps:
      - name: Configure gate reports
        shell: bash
        run: echo "NILS_CLI_REPORT_DIR=$RUNNER_TEMP/nils-cli-reports" >> "$GITHUB_ENV"

      - name: Require change detection
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo 'error: change detection did not succeed; Linux validation is blocked' >&2
            exit 1
          fi

      - name: Require release queue validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CANDIDATE: ${{ needs.changes.outputs.release_candidate }}
          FULL_VALIDATION_RESULT: ${{ needs.full_validation.result }}
        run: |
          if [ "${EVENT_NAME}" = "merge_group" ] && [ "${RELEASE_CANDIDATE}" = "true" ] && \
             [ "${FULL_VALIDATION_RESULT}" != "success" ]; then
            echo 'error: release queue full validation did not succeed' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # test_containment restores this cache under the same shared key.
          shared-key: linux-test
          # Only main saves. rust-cache stores dependencies, not workspace
          # crates, so a PR copy (~1 GB) adds nothing over main's and just
          # evicts the main caches every run restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        if: needs.changes.outputs.release_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python for schema fixtures
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install schema fixture dependency
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: python3 -m pip install 'jsonschema==4.26.0'

      - name: Install zsh + xvfb + ripgrep + tmux + bubblewrap
        if: needs.changes.outputs.release_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux bubblewrap

      - name: Install cargo-nextest
        if: needs.changes.outputs.release_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Keep identical to the copy in the test_containment job.
      - name: Provision systemd user scopes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Build repository devlog checker
        run: |
          cargo build --locked -p nils-devlog
          devlog_bin_dir="$(mktemp -d "${RUNNER_TEMP}/devlog-bin.XXXXXX")"
          cp target/debug/devlog "${devlog_bin_dir}/devlog"
          echo "${devlog_bin_dir}" >> "$GITHUB_PATH"

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, docs-prose-audit, tempdir-leak-audit, test-stale-audit, file-size-audit)
        id: validation
        env:
          NILS_CLI_DEVLOG_BASE: ${{ needs.changes.outputs.base_sha }}
          NILS_CLI_GATE_MIN_AVAILABLE_GIB: "2"
          NILS_CLI_GATE_MEMORY_MAX_GIB: "12"
          NILS_CLI_RUNNER_MAX: "2"
          NILS_CLI_TEST_RUNNER: nextest
          # Prepare exact base/candidate all-feature metadata after restoring
          # Cargo cache; the trusted selector still plans offline and locked.
          NILS_CLI_MERGE_PLAN_PREPARE_METADATA: "1"
          # A skip here would mean a lane that builds every binary lost coverage
          # silently; make it fatal instead. See `bin::sibling_or_skip`.
          NILS_TEST_REQUIRE_SIBLING_BINS: "1"
        run: |
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            bash scripts/ci/nils-cli-checks-entrypoint.sh --docs-only
          elif [ "${{ needs.changes.outputs.release_only }}" = "true" ]; then
            policy_dir="${RUNNER_TEMP}/release-policy"
            mkdir -p "${policy_dir}"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/detect-release-only.sh" \
              >"${policy_dir}/detect-release-only.sh"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/release-only-checks.sh" \
              >"${policy_dir}/release-only-checks.sh"
            mode_args=(--branch "${{ needs.changes.outputs.release_branch }}")
            if [ "${{ needs.changes.outputs.release_mode }}" = "merge-group" ]; then
              mode_args=(--merge-group)
            fi
            RELEASE_ONLY_DETECTOR="${policy_dir}/detect-release-only.sh" \
            bash "${policy_dir}/release-only-checks.sh" \
              --base "${{ needs.changes.outputs.base_sha }}" \
              --head "${{ needs.changes.outputs.head_sha }}" \
              "${mode_args[@]}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            bash scripts/ci/nils-cli-checks-entrypoint.sh --xvfb --ci-merge-plan
          else
            bash scripts/ci/nils-cli-checks-entrypoint.sh --xvfb
          fi

      - name: Upload affected plan and validation receipt
        if: always() && hashFiles('target/ci-merge-plan/validation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: merge-validation-linux
          path: target/ci-merge-plan

      - name: Full validation marker
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true' && (steps.validation.outputs.validation_scope == 'FULL')
        run: true

      - name: Locate JUnit report
        id: junit-report
        if: always()
        shell: bash
        run: |
          if [[ -f "$NILS_CLI_REPORT_DIR/nextest/ci/junit.xml" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit report
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report
          report_paths: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml
          # Keep the job summary bounded; the JUnit artifact and failure
          # annotations retain the detailed test results.
          detailed_summary: false
          group_suite: true
          include_passed: false
          flaky_summary: true

      - name: Upload JUnit XML
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest
          path: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml

  # The cgroup containment checks need a systemd user
  # scope and compile their own agent-session targets (~5.5 min). They run
  # beside `test` instead of in front of it. This required Linux check blocks
  # merge; the shared full workflow also requires it before releases.
  test_containment:
    if: github.event_name != 'push' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: changes
    runs-on: ubuntu-24.04
    # These steps run `cargo test`, so no nextest `slow-timeout` covers them and
    # this limit is their only guard against a hang. The slowest of 176
    # successful full-lane runs on 2026-09-28..30 took 8 minutes (7 with a cold
    # cache).
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the `test` job's main cache; only that job saves it.
          shared-key: linux-test
          save-if: false

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install zsh + xvfb + ripgrep + tmux + bubblewrap
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux bubblewrap

      # Keep identical to the copy in the test job.
      - name: Provision systemd user scopes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Require agent-session cgroup containment
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        env:
          AGENT_SESSION_TEST_REQUIRE_CGROUP: "1"
        run: |
          setsid --wait cargo test -p nils-agent-session --lib \
            tests::delete_kills_a_detached_descendant_inside_a_pinned_tmux_control_group \
            -- --exact --nocapture




  coverage_badge:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: full_validation
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage LCOV
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: target/coverage

      - name: Generate coverage badge
        run: |
          mkdir -p /tmp/coverage-badge
          bash scripts/ci/coverage-badge.sh target/coverage/lcov.info /tmp/coverage-badge/coverage.svg

      - name: Publish coverage badge branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin coverage-badge || true
          if git show-ref --verify --quiet refs/remotes/origin/coverage-badge; then
            git checkout -B coverage-badge origin/coverage-badge
          else
            git checkout --orphan coverage-badge
            git rm -rf . || true
          fi

          mkdir -p badges
          cp /tmp/coverage-badge/coverage.svg badges/coverage.svg
          git add badges/coverage.svg

          if git diff --cached --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "chore: update coverage badge"
          git push origin HEAD:coverage-badge

  main_push:
    if: github.event_name == 'push'
    name: Main push status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record lightweight main update
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "Main advanced to ${COMMIT_SHA}; full CI runs nightly and on demand."


  full_validation:
    needs: changes
    if: always() && ((github.event_name == 'merge_group' && needs.changes.result == 'success' && needs.changes.outputs.release_candidate == 'true') || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/full-validation.yml
    permissions:
      contents: read
      checks: write
    with:
      commit: ${{ github.sha }}
      # Nightly and manual runs also run the poisoned-environment isolation guard.
      isolation_guard: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  nightly_report:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: full_validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update nightly tracking issue
        uses: actions/github-script@v9
        env:
          VALIDATION_RESULT: ${{ needs.full_validation.result }}
        with:
          script: |
            const { trackNightly } = require('./.github/scripts/nightly-tracker.cjs');
            await trackNightly({ github, context, core, result: process.env.VALIDATION_RESULT });
