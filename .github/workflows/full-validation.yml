name: Full validation

# Check out only the caller's immutable event SHA. The commit input asserts
# the requested identity at the final gate; it never selects executable code.

on:
  workflow_call:
    inputs:
      commit:
        description: Expected immutable caller event SHA, verified by the final gate
        required: true
        type: string
      isolation_guard:
        description: Also run the poisoned-environment isolation guard (nightly and manual runs only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  DEVLOG_LAYOUT: fragments

jobs:
  cargo_deny:
    name: cargo-deny (advisories + bans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (RUSTSEC advisories + duplicate-version bans)
        run: bash scripts/ci/cargo-deny-audit.sh

  test:
    runs-on: ubuntu-24.04
    # Backstop for a hang outside a test, such as a stuck build, install, or
    # audit step. A hung test is ended first by the `ci` nextest profile's
    # `slow-timeout`, which names it. The slowest of 186 successful full-lane
    # runs on 2026-09-28..30 took 21 minutes (19 with a cold cache). Keep the
    # test job limits below the merge queue's 90 minute check timeout and the
    # release PR's 60 minute check wait, so a waiter sees the job fail instead
    # of reaching its own timeout.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: write
    steps:
      - name: Configure gate reports
        shell: bash
        run: echo "NILS_CLI_REPORT_DIR=$RUNNER_TEMP/nils-cli-reports" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # test_containment restores this cache under the same shared key.
          shared-key: linux-test
          # Only main saves. rust-cache stores dependencies, not workspace
          # crates, so a PR copy (~1 GB) adds nothing over main's and just
          # evicts the main caches every run restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python for schema fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install schema fixture dependency
        run: python3 -m pip install 'jsonschema==4.26.0'

      - name: Install zsh + xvfb + ripgrep + tmux + bubblewrap
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux bubblewrap

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Keep identical to the copy in the test_containment job.
      - name: Provision systemd user scopes
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Build devlog validator
        run: |
          cargo build --locked -p nils-devlog
          devlog_bin_dir="$(mktemp -d "${RUNNER_TEMP}/devlog-bin.XXXXXX")"
          cp target/debug/devlog "${devlog_bin_dir}/devlog"
          echo "${devlog_bin_dir}" >> "$GITHUB_PATH"

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, docs-prose-audit, tempdir-leak-audit, test-stale-audit, file-size-audit)
        id: validation
        env:
          NILS_CLI_GATE_MIN_AVAILABLE_GIB: "2"
          NILS_CLI_GATE_MEMORY_MAX_GIB: "12"
          NILS_CLI_RUNNER_MAX: "2"
          NILS_CLI_TEST_RUNNER: nextest
          # A skip here would mean a lane that builds every binary lost coverage
          # silently; make it fatal instead. See `bin::sibling_or_skip`.
          NILS_TEST_REQUIRE_SIBLING_BINS: "1"
        run: bash scripts/ci/nils-cli-checks-entrypoint.sh --xvfb

      # Preserve wall p95 as a separate nightly/manual signal: a Nextest pool
      # reservation cannot exclude outside scheduler delay (issue #1705).
      - name: Dispatch latency benchmark (non-required)
        if: ${{ !cancelled() && inputs.isolation_guard }}
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python3 scripts/ci/gate-reports.py cargo nextest run --locked
          --profile performance -p nils-agent-hook --test performance_contract
          --run-ignored ignored-only --test-threads 1

      - name: Publish dispatch latency benchmark
        if: ${{ !cancelled() && inputs.isolation_guard }}
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: Dispatch latency benchmark (non-required)
          report_paths: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/performance/junit.xml
          fail_on_failure: false
          detailed_summary: false
          include_passed: true

      - name: Upload dispatch latency JUnit
        continue-on-error: true
        if: ${{ !cancelled() && inputs.isolation_guard }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-dispatch-performance
          path: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/performance/junit.xml
          if-no-files-found: warn

      - name: Full validation marker
        run: true

      - name: Locate JUnit report
        id: junit-report
        if: always()
        shell: bash
        run: |
          if [[ -f "$NILS_CLI_REPORT_DIR/nextest/ci/junit.xml" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit report
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report
          report_paths: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml
          # Keep the job summary bounded; the JUnit artifact and failure
          # annotations retain the detailed test results.
          detailed_summary: false
          group_suite: true
          include_passed: false
          flaky_summary: true

      - name: Upload JUnit XML
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest
          path: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml

  # The cgroup containment checks need a systemd user
  # scope and compile their own agent-session targets (~5.5 min). They run
  # beside `test` instead of in front of it. The final gate requires this job; a
  # failure here blocks full validation and release builds.

  test_containment:
    runs-on: ubuntu-24.04
    # These steps run `cargo test`, so no nextest `slow-timeout` covers them and
    # this limit is their only guard against a hang. The slowest of 176
    # successful full-lane runs on 2026-09-28..30 took 8 minutes (7 with a cold
    # cache).
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the `test` job's main cache; only that job saves it.
          shared-key: linux-test
          save-if: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install zsh + xvfb + ripgrep + tmux + bubblewrap
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux bubblewrap

      # Keep identical to the copy in the test job.
      - name: Provision systemd user scopes
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Require agent-session cgroup containment
        env:
          AGENT_SESSION_TEST_REQUIRE_CGROUP: "1"
        run: |
          setsid --wait cargo test -p nils-agent-session --lib \
            tests::delete_kills_a_detached_descendant_inside_a_pinned_tmux_control_group \
            -- --exact --nocapture

  # Re-run representative tests under a poisoned environment and fail if any
  # sentinel changes. It runs beside `test` so its 10-12 minutes do not share
  # that job's time limit. Only the nightly and manual call in ci.yml sets the
  # input; release validation and the merge queue never run it, and the gate
  # does not expect it there.
  isolation_guard:
    name: Test isolation guard
    if: inputs.isolation_guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the `test` job's main cache; only that job saves it.
          shared-key: linux-test
          save-if: false

      - name: Set up Python for schema fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install schema fixture dependency
        run: python3 -m pip install 'jsonschema==4.26.0'

      - name: Install zsh + ripgrep + tmux + bubblewrap
        run: sudo apt-get update && sudo apt-get install -y zsh ripgrep tmux bubblewrap

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Keep identical to the copy in the test job.
      - name: Provision systemd user scopes
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Test isolation guard
        run: bash scripts/ci/test-env-isolation-guard.sh

  # The instrumented macOS suite runs as two nextest partitions on separate
  # runners. Repository audits, script tests, fmt, clippy and doc tests are not
  # repeated here: the Linux `test` job runs all of them on the same commit and
  # `macos_clippy` lints the macOS build on every queue entry. Only the tests
  # and their coverage data run per partition; `test_macos` merges the data and
  # enforces the floor.
  test_macos_partition:
    name: test_macos_partition (${{ matrix.partition }}/2)
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Configure gate reports
        shell: bash
        run: echo "NILS_CLI_REPORT_DIR=$RUNNER_TEMP/nils-cli-reports" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache never overwrites an existing key, and the key cut before
          # this job ran instrumented tests holds no llvm-cov-target
          # dependencies, so every run rebuilt ~400 crates (~6 min). A distinct
          # key lets main save a cache that includes them.
          shared-key: macos-test
          key: llvm-cov
          # Only main saves. rust-cache stores dependencies, not workspace
          # crates, so a PR copy (~1 GB) adds nothing over main's and just
          # evicts the main caches every run restores.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python for schema fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install schema fixture dependency
        run: python3 -m pip install 'jsonschema==4.26.0'

      - name: Install bash + ripgrep + tmux
        run: |
          if ! /opt/homebrew/bin/bash --version >/dev/null 2>&1; then
            brew install bash
          fi
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi

      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov
            cargo-nextest

      - name: Nextest partition (instrumented)
        id: validation
        env:
          NILS_CLI_RUNNER_MAX: "2"
          NILS_CLI_TEST_RUNNER: llvm-cov
          NILS_CLI_NEXTEST_PARTITION: count:${{ matrix.partition }}/2
          # A skip here would mean a lane that builds every binary lost coverage
          # silently; make it fatal instead. See `bin::sibling_or_skip`.
          NILS_TEST_REQUIRE_SIBLING_BINS: "1"
        run: /opt/homebrew/bin/bash scripts/ci/nils-cli-checks-entrypoint.sh

      - name: Upload partition LCOV
        if: always() && hashFiles('target/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-partition-${{ matrix.partition }}
          path: target/coverage/lcov.info
          retention-days: 7

      - name: Cleanup coverage outputs (avoid bloating cache)
        if: always()
        run: rm -rf target/coverage

      - name: Locate JUnit report
        id: junit-report
        if: always()
        shell: bash
        run: |
          if [[ -f "$NILS_CLI_REPORT_DIR/nextest/ci/junit.xml" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit report
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report (macOS ${{ matrix.partition }}/2)
          report_paths: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml
          # Keep the job summary bounded; the JUnit artifact and failure
          # annotations retain the detailed test results.
          detailed_summary: false
          group_suite: true
          include_passed: false
          flaky_summary: true

      - name: Upload JUnit XML
        if: always() && steps.junit-report.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest-macos-${{ matrix.partition }}
          path: ${{ env.NILS_CLI_REPORT_DIR }}/nextest/ci/junit.xml

  # Both macOS partitions must pass before this job runs, so its success is the
  # required macOS result. It merges their LCOV reports and enforces the same
  # workspace line floor the single instrumented run enforced. It needs no macOS
  # runner. The HTML report is built only for nightly and manual runs
  # (`isolation_guard`), not for release validation.
  test_macos:
    needs: test_macos_partition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download partition LCOV
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-lcov-partition-*
          path: target/partitions

      - name: Merge partition coverage and enforce the floor
        env:
          NILS_CLI_COVERAGE_FAIL_UNDER_LINES: "85"
        run: |
          [ "$(find target/partitions -name lcov.info | wc -l)" -eq 2 ]
          mkdir -p target/coverage
          python3 scripts/ci/merge-lcov.py target/partitions/*/lcov.info \
            --output target/coverage/lcov.info \
            --fail-under-lines "$NILS_CLI_COVERAGE_FAIL_UNDER_LINES"

      - name: Full validation marker
        run: true

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          retention-days: 7

      - name: Generate HTML coverage report
        if: inputs.isolation_guard
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # The LCOV source paths point into the macOS runner workspace, which
          # this checkout lacks, so the report is built without source text.
          genhtml target/coverage/lcov.info --synthesize-missing \
            --ignore-errors source --output-directory target/coverage/html

      - name: Upload coverage HTML
        if: inputs.isolation_guard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage/html
          retention-days: 7

  # The coverage floor is enforced by test_macos on the merged partition data;
  # this job keeps the required `coverage` check by proving that merge produced
  # its LCOV report and by publishing the summary. It needs no macOS runner.

  coverage:
    needs: test_macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download coverage LCOV
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: target/coverage
      - name: Require LCOV from the instrumented test run
        run: test -s target/coverage/lcov.info
      - name: Full validation marker
        run: true
      - name: Coverage summary
        run: bash scripts/ci/coverage-summary.sh target/coverage/lcov.info

  gate:
    needs: [test, test_macos, coverage, test_containment, cargo_deny, isolation_guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose unacquired macOS runner
        id: macos_capacity
        if: needs.test_macos.result != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/macos-runner-capacity.cjs').reportMacosCapacity({github, context, core});
      - name: Require all full-validation lanes
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          ISOLATION_GUARD: ${{ inputs.isolation_guard }}
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
          MACOS_JOBS: ${{ steps.macos_capacity.outputs.jobs || '[]' }}
        run: |
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          export ACTUAL_COMMIT
          node -e 'require("./.github/scripts/full-validation-gate.cjs").requireFullValidation({expected: process.env.EXPECTED_COMMIT, actual: process.env.ACTUAL_COMMIT, isolationGuard: process.env.ISOLATION_GUARD === "true", needs: JSON.parse(process.env.VALIDATION_NEEDS), macosJobs: JSON.parse(process.env.MACOS_JOBS)})'
