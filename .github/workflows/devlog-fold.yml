name: Devlog fold

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare the fold without creating remote commits, branches or PRs"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/devlog-fold.yml"
      - ".github/scripts/devlog-fold-pr.cjs"
      - "scripts/ci/tests/devlog-fold-pr.test.cjs"
      - "scripts/ci/fold-devlog.sh"

permissions:
  contents: read
  pull-requests: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build the fragment writer
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p nils-devlog
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Test dry-run and publication with synthetic repositories and APIs
        run: |
          source scripts/dev-env.sh
          node --test scripts/ci/tests/devlog-fold-pr.test.cjs

  fold:
    needs: fixtures
    # PR fixtures must not replace a queued release in this publication lock.
    concurrency:
      group: devlog-fold
      cancel-in-progress: false
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main for fold preparation
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build the fragment writer
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p nils-devlog
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Require bot app credentials
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          source scripts/dev-env.sh
          if [[ -z "$BOT_APP_ID" || -z "$BOT_APP_PRIVATE_KEY" ]]; then
            echo "::error::BOT_APP_ID / BOT_APP_PRIVATE_KEY are required with Contents: write and Pull requests: write." >&2
            exit 1
          fi
      - name: Mint bot token
        if: github.event_name == 'release' || !inputs.dry_run
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare the fold and open its reviewed PR
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { runFoldPR } = require("./.github/scripts/devlog-fold-pr.cjs");
            const dryRun = process.env.DRY_RUN === "true";
            if (!dryRun && !process.env.BOT_TOKEN) throw new Error("Publication requires the bot App token");
            const client = dryRun ? github : getOctokit(process.env.BOT_TOKEN);
            const result = await runFoldPR({ github: client, context, dryRun });
            core.info(JSON.stringify(result));
            await core.summary.addCodeBlock(JSON.stringify(result, null, 2), "json").write();
      - name: Retain the prepared diff in the run log
        run: git diff --cached --stat -- docs/devlog
