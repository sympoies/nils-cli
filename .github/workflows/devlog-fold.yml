name: Devlog fold

on:
  workflow_call:
    inputs:
      release_id:
        description: "GitHub release ID returned by the successful publication job"
        required: true
        type: string
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare the fold without creating remote commits, branches or PRs"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/devlog-fold.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/devlog-fold-*.cjs"
      - "scripts/ci/tests/devlog-fold-*.test.cjs"
      - "scripts/ci/fold-devlog.sh"
      - "crates/devlog/**"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Build the fragment writer
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p nils-devlog
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Test preparation and admission with synthetic repositories and APIs
        run: |
          source scripts/dev-env.sh
          node --test scripts/ci/tests/devlog-fold-*.test.cjs

  fold:
    needs: fixtures
    name: Fold publication and admission
    # PR fixtures must not replace a queued release in this publication lock.
    concurrency:
      group: devlog-fold${{ inputs.dry_run && '-dry-run' || '' }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout current main for fold preparation
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Build the fragment writer
        run: |
          source scripts/dev-env.sh
          cargo build --locked -p nils-devlog
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          echo "FOLD_DIR=$RUNNER_TEMP/devlog-fold" >> "$GITHUB_ENV"

      - name: Verify release publication and locate its fold receipt
        if: github.ref_type == 'tag'
        id: publication
        uses: actions/github-script@v9
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const fs = require("node:fs");
            const dir = process.env.FOLD_DIR;
            fs.mkdirSync(dir);
            const { checkoutGit } = require("./.github/scripts/devlog-fold-pr.cjs");
            const { findReleasePreparation, readPublication, receiptName, tracker } = require("./.github/scripts/devlog-fold-release.cjs");
            const note = tracker({ context, core, file: dir + "/result.json" });
            await note("publication");
            const release = await readPublication({ github, context, git: checkoutGit(process.cwd(), process.env),
              workflowRef: process.env.WORKFLOW_REF, releaseId: process.env.RELEASE_ID });
            fs.writeFileSync(dir + "/release.json", JSON.stringify(release));
            await note("receipt", { release });
            const artifact = await findReleasePreparation(github, context.repo, release);
            core.setOutput("artifact", artifact?.id ?? "");
            core.setOutput("preparation_run", artifact?.runId ?? release.runId);
            core.setOutput("receipt_name", receiptName(release));

      - name: Read immutable preparation receipt for this release
        if: steps.publication.outputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.publication.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.publication.outputs.preparation_run }}
          path: ${{ env.FOLD_DIR }}

      - name: Mint bot token
        if: '!inputs.dry_run'
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare and sign the release fold
        if: github.ref_type == 'tag' && steps.publication.outputs.artifact == ''
        uses: actions/github-script@v9
        env:
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          script: |
            const fs = require("node:fs");
            const dir = process.env.FOLD_DIR;
            const { prepareReleaseFold, tracker } = require("./.github/scripts/devlog-fold-release.cjs");
            const note = tracker({ context, core, file: dir + "/result.json" });
            const release = JSON.parse(fs.readFileSync(dir + "/release.json", "utf8"));
            const { BOT_TOKEN, ...env } = process.env;
            if (!BOT_TOKEN) throw new Error("Preparation requires the bot App");
            const receipt = await prepareReleaseFold({ github, writer: getOctokit(BOT_TOKEN),
              repo: context.repo, root: process.cwd(), env, release, note });
            fs.writeFileSync(dir + "/preparation.json", JSON.stringify(receipt));
            await note("prepared", receipt);

      - name: Retain exact base and head before publication
        if: github.ref_type == 'tag' && steps.publication.outputs.artifact == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publication.outputs.receipt_name }}
          path: ${{ env.FOLD_DIR }}/preparation.json
          if-no-files-found: error

      - name: Reproduce, publish and admit the exact release fold
        if: github.ref_type == 'tag'
        uses: actions/github-script@v9
        env:
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
          BOT_APP_SLUG: ${{ steps.bot_token.outputs.app-slug }}
          PREPARATION_RUN: ${{ steps.publication.outputs.preparation_run }}
        with:
          script: |
            const fs = require("node:fs");
            const dir = process.env.FOLD_DIR;
            const { tracker } = require("./.github/scripts/devlog-fold-release.cjs");
            const { admitReleaseFold } = require("./.github/scripts/devlog-fold-admission.cjs");
            const note = tracker({ context, core, file: dir + "/result.json" });
            const release = JSON.parse(fs.readFileSync(dir + "/release.json", "utf8"));
            const receipt = JSON.parse(fs.readFileSync(dir + "/preparation.json", "utf8"));
            const { BOT_TOKEN, BOT_APP_SLUG: app, PREPARATION_RUN, ...env } = process.env;
            if (!app || !BOT_TOKEN) throw new Error("Publication requires the bot App");
            const options = { github, writer: getOctokit(BOT_TOKEN), repo: context.repo,
              app, release, root: process.cwd(), env, receipt, note, preparationRunId: Number(PREPARATION_RUN) };
            await admitReleaseFold(options);

      - name: Retain release fold result
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: devlog-fold-result-${{ github.run_attempt }}
          path: ${{ env.FOLD_DIR }}/result.json
          if-no-files-found: ignore

      - name: Prepare manual fold for steward review
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          script: |
            const { runFoldPR } = require("./.github/scripts/devlog-fold-pr.cjs");
            const { BOT_TOKEN, DRY_RUN, ...env } = process.env;
            const dryRun = DRY_RUN === "true";
            if (!dryRun && !BOT_TOKEN) throw new Error("Publication requires the bot App token");
            const client = dryRun ? github : getOctokit(BOT_TOKEN);
            const result = await runFoldPR({ github: client, context, dryRun, env });
            core.info(JSON.stringify(result));
            await core.summary.addCodeBlock(JSON.stringify(result, null, 2), "json").write();

      - name: Retain the prepared diff in the run log
        if: github.ref == 'refs/heads/main'
        run: git diff --cached --stat -- docs/devlog
