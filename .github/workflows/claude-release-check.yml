name: Claude Code release check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Serialize discovery, version-keyed issues and immutable candidate branches.
concurrency:
  group: claude-release-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # Trusted code only: skip the heavy check when this version already has a
    # candidate PR or failure issue. Manual runs always do the full check.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Skip versions that already have a candidate or failure record
        id: plan
        if: github.event_name == 'schedule'
        # Fail open: an unavailable lookup leaves skip empty and the full check runs.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { planReleaseCheck } = require("./.github/scripts/claude-release-check.cjs");
            await planReleaseCheck({ github, context, core });

  check:
    # Candidate code runs only on this read-only runner, with no token input.
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test release preparation fixtures
        run: |
          source scripts/dev-env.sh
          node scripts/ci/tests/claude-release-check.test.cjs

      - name: Discover official stable release
        id: discover
        # Discovery errors still reach the reporting step; never fabricate a candidate.
        continue-on-error: true
        run: |
          source scripts/dev-env.sh
          node <<'JS'
          const fs = require("node:fs");
          const { discover, range, compare } = require("./.github/scripts/claude-release-check.cjs");
          (async () => {
            fs.mkdirSync("claude-release-check", { recursive: true });
            const release = await discover();
            fs.writeFileSync("claude-release-check/discovery.json", JSON.stringify(release, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `newer=${compare(release.version, range(process.cwd()).max) > 0}\n`);
          })().catch(() => { console.error("Official stable registry discovery failed; inspect the reporting step."); process.exitCode = 1; });
          JS

      - name: Set up Rust for the existing contract tests
        if: steps.discover.outputs.newer == 'true'
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Compile existing module contract tests
        id: compile
        if: steps.discover.outputs.newer == 'true'
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: "4"
        # Build only trusted checkout code. Candidate execution below gets a cleared environment.
        run: |
          source scripts/dev-env.sh
          node <<'JS'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const args = ["test", "--locked", "-p", "nils-agent-session", "--lib", "--no-run", "--message-format=json"];
          const output = spawnSync("cargo", args, { encoding: "utf8", timeout: 1800000, maxBuffer: 64 * 1024 * 1024 });
          fs.writeFileSync("claude-release-check/contract-build.json", JSON.stringify({ command: ["cargo", ...args].join(" "), exit: output.status, signal: output.signal }));
          fs.writeFileSync("claude-release-check/contract-build.log", `${output.stdout || ""}${output.stderr || ""}`);
          if (output.status !== 0) process.exit(1);
          const records = output.stdout.split("\n").filter(Boolean).map(line => JSON.parse(line));
          const binaries = records.filter(row => row.reason === "compiler-artifact" && row.profile.test && row.executable && row.target.name === "agent_session");
          if (binaries.length !== 1) throw new Error("Expected one compiled module contract test binary");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLAUDE_CONTRACT_TEST_BINARY=${binaries[0].executable}\n`);
          JS

      - name: Collect isolated contract evidence and range-only patch
        if: always() && !cancelled() && steps.discover.outcome != 'skipped'
        run: |
          source scripts/dev-env.sh
          node <<'JS'
          const fs = require("node:fs");
          const { collectReleaseCheck } = require("./.github/scripts/claude-release-check.cjs");
          const file = "claude-release-check/discovery.json";
          const discoverRelease = fs.existsSync(file)
            ? async () => JSON.parse(fs.readFileSync(file, "utf8")) : undefined;
          collectReleaseCheck({ sourceSha: process.env.GITHUB_SHA, discoverRelease })
            .catch(() => { console.error("Evidence collection unavailable"); process.exitCode = 1; });
          JS

      - name: Retain exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-release-check
          path: claude-release-check/
          if-no-files-found: warn
          retention-days: 30


  publish:
    # A fresh runner consumes data only; no upstream install or candidate execution.
    needs: check
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read candidate evidence from the read-only job
        uses: actions/download-artifact@v8
        with:
          name: claude-release-check
          path: ${{ runner.temp }}/claude-check-evidence

      - name: Plan candidate publication
        id: publication_plan
        env:
          CLAUDE_CHECK_ARTIFACT_DIR: ${{ runner.temp }}/claude-check-evidence
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const checked = JSON.parse(fs.readFileSync(path.join(process.env.CLAUDE_CHECK_ARTIFACT_DIR, "checked.json"), "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${!checked.error && checked.check?.passed === true}\n`);
          JS

      - name: Require bot app credentials
        if: steps.publication_plan.outputs.candidate == 'true'
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_APP_ID}" ] || [ -z "${BOT_APP_PRIVATE_KEY}" ]; then
            echo "::error::BOT_APP_ID / BOT_APP_PRIVATE_KEY are not configured. Configure the bot app to create candidate pull requests." >&2
            exit 1
          fi

      - name: Mint bot token
        if: steps.publication_plan.outputs.candidate == 'true'
        id: bot_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare draft range candidate from validated evidence
        uses: actions/github-script@v9
        env:
          CLAUDE_CHECK_ARTIFACT_DIR: ${{ runner.temp }}/claude-check-evidence
          ISSUE_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { runReleaseCheck } = require("./.github/scripts/claude-release-check.cjs");
            const read = name => {
              const file = path.join(process.env.CLAUDE_CHECK_ARTIFACT_DIR, name);
              if (!fs.lstatSync(file).isFile() || fs.statSync(file).size > 2 * 1024 * 1024)
                throw new Error("Bounded regular evidence file required");
              return JSON.parse(fs.readFileSync(file, "utf8"));
            };
            const checked = read("checked.json");
            if (!checked.error && checked.check?.passed === true && !process.env.BOT_TOKEN)
              throw new Error("Candidate publication requires a bot App token");
            await runReleaseCheck({ github: process.env.BOT_TOKEN ? getOctokit(process.env.BOT_TOKEN) : github, issueGithub: getOctokit(process.env.ISSUE_TOKEN), context, core,
              checked, patch: read("candidate.patch.json") });

      - name: Retain publication result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-release-publication
          path: claude-release-check/
          if-no-files-found: warn
          retention-days: 30
