version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Numbered rust-toolchain refs select Rust releases, not action releases.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns:
          - "*"
